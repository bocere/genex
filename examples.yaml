          }
        ],
        "offset": 0,
        "limit": 50,
        "total": 1,
        "hasMore": false
      }

/api/v1/products/{productId}:
  get:
    curl: 'curl -X GET "https://${API_SERVER_URL}/api/v1/products/{productId}"'
    summary: Get a product by ID
    response: |
      {
        "sku": "SKU-1001",
        "name": "Trail Running Shoe",
        "price": 24.99,
        "currency": "USD",
        "inStock": true,
        "quantityAvailable": 128
      }
  put:
    curl: 'curl -X PUT -H "Content-Type: application/json" -d @product.json "https://${API_SERVER_URL}/api/v1/products/{productId}"'
    summary: Update a product's details
    request: |
      {
        "name": "Trail Running Shoe",
        "price": 22.99,
        "currency": "USD"
      }
    response: |
      {
        "sku": "SKU-1001",
        "name": "Trail Running Shoe",
        "price": 22.99,
        "currency": "USD",
        "lastModifiedTime": "2026-01-15T11:15:30.000Z"
      }
  post:
    curl: 'curl -X POST -H "Content-Type: application/json" -d @restock.json "https://${API_SERVER_URL}/api/v1/products/{productId}"'
    summary: Restock a product (add to available quantity)
    request: |
      {
        "quantityAdded": 50,
        "warehouseId": "WH-EAST-01"
      }
    response: |
      {
        "sku": "SKU-1001",
        "quantityAvailable": 178,
        "inStock": true
      }

# Account settings
/api/v1/settings:
  put:
    curl: 'curl -X PUT -H "Content-Type: application/json" -d @settings.json "https://${API_SERVER_URL}/api/v1/settings"'
    summary: Update account-level settings
    request: |
      {
        "defaultCurrency": "USD",
        "notificationsEnabled": true
      }
    response: |
      {
        "defaultCurrency": "USD",
        "notificationsEnabled": true,
        "lastModifiedTime": "2026-01-15T11:20:00.000Z"
      }
